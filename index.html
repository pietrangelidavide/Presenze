<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Presenze</title>
    <meta name="description" content="Ore di lavoro, pausa pranzo, permessi e smart working: registri tutto in pochi tocchi e vedi come cambia nel tempo." />
    <meta name="theme-color" content="#F1F3F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13162E" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /* Applica subito il tema scelto, per evitare il lampo di colore all'avvio */
      try {
        var t = localStorage.getItem('presenze-tema');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
